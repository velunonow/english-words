[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "english-words"
version = "0.1.0"
description = "A personal English vocabulary notebook in an Obsidian vault, with SM-2 reviews."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
anthropic = ["anthropic"]
dev = ["pytest>=8"]

[project.scripts]
vocab = "vocab.cli:main"

[tool.setuptools]
packages = ["vocab"]
