name: Morning review

# Writes reviews/<today>.md and commits it, so Obsidian Git pulls it in.
# Off by default: run it by hand from the Actions tab, or uncomment the schedule.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 15 * * *"  # cron is UTC; 15:00 UTC is 7 AM in Los Angeles in winter

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles  # "today" is your local day
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: vocab review
      - name: Commit the review note
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews words
          git diff --cached --quiet || git commit -m "Morning review $(date +%F)"
          git push
